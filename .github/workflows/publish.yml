name: Publish to npm

on:
  release:
    types: [published]

permissions:
  id-token: write  # Required for OIDC Trusted Publisher auth

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          registry-url: "https://registry.npmjs.org"
          cache: "npm"

      - name: Upgrade npm (Trusted Publishers requires >= 11.5.1)
        run: npm install -g npm@latest

      - name: Verify tag matches package.json version
        run: |
          PKG_VERSION="v$(node -p "require('./package.json').version")"
          TAG_VERSION="${GITHUB_REF_NAME}"
          if [ "$PKG_VERSION" != "$TAG_VERSION" ]; then
            echo "Tag $TAG_VERSION does not match package.json version $PKG_VERSION"
            exit 1
          fi

      - name: Install backend deps
        run: npm ci

      - name: Build
        run: npm run build

      - name: Backend tests (100% coverage enforced)
        run: npx vitest run --coverage

      - name: Install frontend deps
        working-directory: frontend
        run: npm ci

      - name: Frontend tests (100% coverage enforced)
        working-directory: frontend
        run: npx vitest run --coverage

      - name: Publish to npm
        run: npm publish --access public
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
